[package]
name = "smartapc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
async_opcua = { package = "async-opcua", version = "0.18", features = ["client", "server"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
eframe = "0.33"
egui_plot = "0.34"
iced = { version = "0.14.0", default-features = false, features = ["tokio", "wgpu", "canvas"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8"
nalgebra = "0.34"
osqp = "1.0"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["v4", "serde"] }

[dev-dependencies]
axum-test = "17.3"
tempfile = "3.19"
